services:
  dashboard:
    image: simdb-dashboard:service
    labels:
      io.simdb.component: "dashboard"
    build: 
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-unknown}
    environment:
      # Serve Dashboard at this port on the container host
      DASHBOARD_PORT: "${DASHBOARD_PORT:-80}"
      # SIMDB_SERVER_URL is used by the browser client, specify either a relative path or full URL
      SIMDB_SERVER_URL: ${SIMDB_SERVER_URL:-/scenarios/api}
      # API_PORT and API_HOST point to SimDB server internally (used by nginx proxy)
      API_PORT: "${API_PORT:-5000}"
      API_HOST: "${API_HOST:-host.docker.internal}"
    ports:
      - "${DASHBOARD_PORT:-80}:80"
    volumes:
      - ./docker/dashboard.nginx:/etc/nginx/templates/default.conf.template
      - ./docker/runtime-config-template.js:/usr/share/nginx/html/runtime-config-template.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
