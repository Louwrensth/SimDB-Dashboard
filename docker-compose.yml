services:
  dashboard:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./docker/proxy_params:/etc/nginx/proxy_params
      - ./docker/dashboard.nginx:/etc/nginx/conf.d/default.conf
      - ./docker/runtime-config-template.js:/usr/share/nginx/html/runtime-config-template.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
