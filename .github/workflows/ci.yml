name: CI/CD Pipeline

env:
  CACHE_FROM: type=gha,scope=simdb-dashboard
  CACHE_TO: type=gha,mode=max,scope=simdb-dashboard

on:
  # Triggers on pushes to develop, on pushed tags, and on pull requests targeting develop.
  push:
    branches: [ "develop" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "develop" ]

# Serialize runs per ref, so that two merges in quick succession can't race to
# move the "develop" image tag backward. Superseded runs are not cancelled, so
# every merged commit still gets a versioned image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify, and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0

    - name: Get version
      id: version
      run: echo "value=$(git describe --tags --always 2>/dev/null || echo 0.0.0-unknown)" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # APP_VERSION is embedded into the static assets at build time
    - name: Build build image
      uses: docker/build-push-action@v7
      with:
        target: build
        load: true
        tags: simdb-dashboard:build
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Run lint from build image
      run: docker run --rm simdb-dashboard:build npm run lint

    - name: Run type-check from build image
      run: docker run --rm simdb-dashboard:build npm run type-check

    - name: Run unit tests from build image
      run: docker run --rm simdb-dashboard:build npm run test:unit -- --run

    - name: Build service image
      uses: docker/build-push-action@v7
      with:
        target: service
        load: true
        tags: simdb-dashboard:service
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Smoke test service image runtime config
      run: |
        docker run -d --rm --name simdb-dashboard-smoke -p 8080:80 \
          --add-host host.docker.internal:host-gateway \
          simdb-dashboard:service
        trap 'docker rm -f simdb-dashboard-smoke >/dev/null 2>&1 || true' EXIT

        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8080/dashboard/runtime-config.js >/tmp/runtime-config.js; then
            break
          fi
          sleep 1
        done

        curl -fsS http://localhost:8080/dashboard/runtime-config.js >/tmp/runtime-config.js
        grep -q "window.__SIMDB_RUNTIME_CONFIG__" /tmp/runtime-config.js
        ! grep -q "SIMDB_SERVER_URL" /tmp/runtime-config.js

    - name: Extract static dist assets
      run: |
        rm -rf "${{ runner.temp }}/dist"
        mkdir -p "${{ runner.temp }}/dist"
        docker rm -f tmp_dist_container >/dev/null 2>&1 || true
        docker create --name tmp_dist_container simdb-dashboard:build >/dev/null
        docker cp tmp_dist_container:/app/dist/. "${{ runner.temp }}/dist"
        docker rm tmp_dist_container >/dev/null

    - name: Upload static assets artifact
      uses: actions/upload-artifact@v7
      with:
        name: simdb-dashboard-dist
        path: ${{ runner.temp }}/dist/
        retention-days: 7

    - name: Export service image tar
      run: docker save -o "${{ runner.temp }}/simdb-dashboard-service.tar" simdb-dashboard:service

    - name: Upload service image artifact
      uses: actions/upload-artifact@v7
      with:
        name: simdb-dashboard-service
        path: ${{ runner.temp }}/simdb-dashboard-service.tar
        retention-days: 7

  publish:
    name: Publish service image
    # Runs only for push events (branch/tag pushes), and is skipped for pull_request events.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write
    steps:
    - name: Lowercase repo-owner
      id: repo_owner
      run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

    - name: Download service image artifact
      uses: actions/download-artifact@v8
      with:
        name: simdb-dashboard-service
        path: ${{ runner.temp }}

    - name: Download dist artifact
      uses: actions/download-artifact@v8
      with:
        name: simdb-dashboard-dist
        path: ${{ runner.temp }}/dist

    - name: Load service image
      run: docker load -i "${{ runner.temp }}/simdb-dashboard-service.tar"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ steps.repo_owner.outputs.value }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Run on branch pushes (develop only) and _any_ tag pushes.
    - name: Tag and push service image with version tag
      run: |
        docker tag \
          simdb-dashboard:service \
          ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-dashboard:${{ needs.build.outputs.version }}
        docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-dashboard:${{ needs.build.outputs.version }}

    # Run on branch pushes only, so that older tag pushes won't overwrite newer develop images
    - name: Tag and push service image with "develop"
      if: ${{ github.ref_type == 'branch' }}
      # Note that branch pushes other than to "develop" are already filtered out by workflow trigger rules above
      run: |
        docker tag \
          simdb-dashboard:service \
          ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-dashboard:develop
        docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-dashboard:develop

    # These steps run on tag pushes only
    - name: Tag and push service image with "latest"
      if: ${{ github.ref_type == 'tag' }}
      run: |
        docker tag \
          simdb-dashboard:service \
          ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-dashboard:latest
        docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-dashboard:latest

    - name: Package and upload release tarball
      if: ${{ github.ref_type == 'tag' }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        tar -czf "${{ runner.temp }}/simdb-dashboard-dist.tar.gz" \
          -C "${{ runner.temp }}/dist" .
        gh release create "${{ needs.build.outputs.version }}" \
          "${{ runner.temp }}/simdb-dashboard-dist.tar.gz" \
          --generate-notes
