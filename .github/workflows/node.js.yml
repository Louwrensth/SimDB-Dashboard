name: CI/CD Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: |
        cd dashboard
        bun install --frozen-lockfile

    - name: Run linter
      run: |
        cd dashboard
        bun run lint

    - name: Run type check
      run: |
        cd dashboard
        bun run type-check

    - name: Upload coverage reports
      uses: codecov/codecov-action@v6
      with:
        directory: ./dashboard/coverage

  build:
    name: Build Application
    runs-on: ubuntu-22.04
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: |
        cd dashboard
        bun install --frozen-lockfile

    - name: Build application
      run: |
        cd dashboard
        bun run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dashboard/dist/
        retention-days: 7
