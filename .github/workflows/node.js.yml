# CI pipeline orchestrated with Make targets and Docker build stages.
# Node version is defined in the Dockerfile.
# Buildx cache settings are provided through CACHE_FROM and CACHE_TO.
# Local and CI execution stay aligned through the same make commands.

name: CI/CD Pipeline

env:
  CACHE_FROM: type=gha,scope=simdb-dashboard
  CACHE_TO: type=gha,mode=max,scope=simdb-dashboard
  DOCKER_BUILDKIT: "1"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    name: Build service image
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build service image (docker stage)
      run: make service

    - name: Run tests (docker stage)
      run: |
        mkdir -p test-results
        make test 2>&1 | tee test-results/test.log

    - name: Extract frontend assets
      run: make dist

    - name: Export service image artifact
      run: |
        mkdir -p artifacts
        docker image inspect simdb-dashboard:service >/dev/null 2>&1
        docker save -o artifacts/simdb-dashboard.tar simdb-dashboard:service

    - name: Upload static assets artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

    - name: Upload service image artifact
      uses: actions/upload-artifact@v4
      with:
        name: simdb-dashboard
        path: artifacts/simdb-dashboard.tar
        retention-days: 7
