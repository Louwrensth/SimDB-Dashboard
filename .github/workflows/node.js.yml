name: CI/CD Pipeline

env:
  CACHE_FROM: type=gha,scope=simdb-dashboard
  CACHE_TO: type=gha,mode=max,scope=simdb-dashboard

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    name: Build, test, and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0

    - name: Get version
      id: version
      run: echo "value=$(git describe --tags --always 2>/dev/null || echo 0.0.0-unknown)" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # APP_VERSION is _not_ passed to lint/test targets: those stages inherit from
    # the builder stage which does not consume it, so omitting it avoids
    # unnecessary cache invalidation on every run.
    - name: Build lint target
      uses: docker/build-push-action@v7
      with:
        context: .
        target: lint
        push: false
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Build test target
      uses: docker/build-push-action@v7
      with:
        context: .
        target: test
        push: false
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    # APP_VERSION is embedded into the static assets at build time
    - name: Build build target image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: build
        push: false
        load: true
        tags: simdb-dashboard:build
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Build service image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: service
        push: false
        load: true
        tags: simdb-dashboard:service
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Extract static dist assets
      run: |
        rm -rf "${{ runner.temp }}/dist"
        mkdir -p "${{ runner.temp }}/dist"
        docker rm -f tmp_dist_container >/dev/null 2>&1 || true
        docker create --name tmp_dist_container simdb-dashboard:build >/dev/null
        docker cp tmp_dist_container:/app/dist/. "${{ runner.temp }}/dist"
        docker rm tmp_dist_container >/dev/null

    - name: Upload static assets artifact
      uses: actions/upload-artifact@v4
      with:
        name: simdb-dashboard-dist
        path: ${{ runner.temp }}/dist/
        retention-days: 7

    - name: Export service image tar
      run: docker save -o "${{ runner.temp }}/simdb-dashboard-service.tar" simdb-dashboard:service

    - name: Upload service image artifact
      uses: actions/upload-artifact@v4
      with:
        name: simdb-dashboard-service
        path: ${{ runner.temp }}/simdb-dashboard-service.tar
        retention-days: 7

  publish:
    name: Publish service image
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
    - name: Lowercase repo-owner
      id: repo_owner
      run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

    - name: Download service image artifact
      uses: actions/download-artifact@v4
      with:
        name: simdb-dashboard-service
        path: ${{ runner.temp }}

    - name: Load service image
      run: docker load -i "${{ runner.temp }}/simdb-dashboard-service.tar"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag service image for registry
      run: |
        docker tag \
          simdb-dashboard:service \
          ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-dashboard:service-${{ needs.build.outputs.version }}

    - name: Push service image
      run: docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-dashboard:service-${{ needs.build.outputs.version }}
