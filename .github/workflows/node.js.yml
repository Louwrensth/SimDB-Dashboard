name: CI/CD Pipeline

env:
  CACHE_FROM: type=gha,scope=simdb-dashboard
  CACHE_TO: type=gha,mode=max,scope=simdb-dashboard

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    name: Build, test, and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0


    - name: Get version
      id: version
      run: echo "value=$(git describe --tags --always 2>/dev/null || echo 0.0.0-unknown)" >> "$GITHUB_OUTPUT"

    - name: Lowercase repo-owner
      run: |
        # use Bash to convert to lowercase
        echo "REPO_OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # APP_VERSION is _not_ passed to lint/test targets: those stages inherit from
    # the builder stage which does not consume it, so omitting it avoids
    # unnecessary cache invalidation on every run.
    - name: Build lint target
      uses: docker/build-push-action@v7
      with:
        context: .
        target: lint
        push: false
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Build test target
      uses: docker/build-push-action@v7
      with:
        context: .
        target: test
        push: false
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    # APP_VERSION is embedded into the static assets at build time
    - name: Build build target image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: build
        push: false
        load: true
        tags: simdb-dashboard:build
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Build service image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: service
        push: false
        load: true
        tags: simdb-dashboard:service
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push service image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: service
        push: true
        load: true
        tags: ghcr.io/${{ env.REPO_OWNER_LOWER }}/simdb-dashboard:service-${{ steps.version.outputs.value }}
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

