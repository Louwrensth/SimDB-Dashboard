# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI/CD Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  define-matrix:
    name: Define Node matrix
    runs-on: ubuntu-22.04
    outputs:
      node-versions: ${{ steps.set-matrix.outputs.node-versions }}
    steps:
    - name: Set Node versions
      id: set-matrix
      run: echo 'node-versions={"node-version":["22.x","24.x","26.x"]}' >> "$GITHUB_OUTPUT"

  test:
    name: Test and Lint
    runs-on: ubuntu-22.04
    needs: define-matrix

    strategy:
      matrix: ${{ fromJSON(needs.define-matrix.outputs.node-versions) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json

    - name: Install dependencies
      run: |
        cd dashboard
        npm ci
        
    - name: Run linter
      run: |
        cd dashboard
        npm run lint
        
    - name: Run type check
      run: |
        cd dashboard
        npm run type-check        
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v6
      with:
        directory: ./dashboard/coverage

  build:
    name: Build Application
    runs-on: ubuntu-22.04
    needs:
    - define-matrix
    - test

    strategy:
      matrix: ${{ fromJSON(needs.define-matrix.outputs.node-versions) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
        
    - name: Install dependencies
      run: |
        cd dashboard
        npm ci
        
    - name: Build application
      run: |
        cd dashboard
        npm run build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.node-version }}
        path: dashboard/dist/
        retention-days: 7
